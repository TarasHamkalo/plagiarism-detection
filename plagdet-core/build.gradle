plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}


repositories {
    maven {
        url "https://repo.languagetool.org/artifactory/languagetool-os-release/"
    }

    mavenCentral()
    flatDir {
        dirs '../libs'
    }

}

ext {
    javacppPlatform = 'linux-x86_64'
}

dependencies {

    implementation 'org.apache.lucene:lucene-core:8.10.1'

    implementation 'org.apache.lucene:lucene-queryparser:8.10.1'

    implementation 'org.apache.lucene:lucene-analyzers-common:8.10.1'

    implementation 'org.apache.lucene:lucene-backward-codecs:8.10.1'

    implementation 'org.apache.lucene:lucene-codecs:8.10.1'

    implementation 'org.apache.poi:poi-ooxml:5.4.0'

    implementation 'org.apache.poi:poi:5.4.0'

    implementation 'org.apache.poi:poi-scratchpad:5.4.0'

    implementation 'org.apache.commons:commons-lang3:3.16.0'

    implementation 'commons-io:commons-io:2.17.0'

    implementation 'org.apache.commons:commons-compress:1.27.1'

    implementation 'org.apache.pdfbox:pdfbox:3.0.4'

    implementation 'org.apache.commons:commons-text:1.13.0'

    implementation ':morphodita:'

    implementation('edu.stanford.nlp:stanford-corenlp:4.5.8') {
        exclude group: 'com.apple', module: 'AppleJavaExtensions'
        exclude group: 'jakarta.servlet', module: 'jakarta.servlet-api'
        exclude group: 'org.ejml', module: 'jakarta.json'
        exclude group: 'org.ejml', module: 'ejml-simple'
        exclude group: 'org.glassfish', module: 'jakarta.json'
    }

    implementation('org.deeplearning4j:deeplearning4j-nlp:1.0.0-M2.1') {
        exclude group: 'org.bytedeco', module: 'openblas'
        exclude group: 'org.bytedeco', module: 'opencv'
        exclude group: 'org.bytedeco', module: 'hdf5'
        exclude group: 'org.bytedeco', module: 'leptonica'
        exclude group: 'org.bytedeco', module: 'ffmpeg'
        exclude group: 'org.deeplearning4j', module: 'deeplearning4j-datasets'
        exclude group: 'org.datavec', module: 'datavec-data-image'
    }

    implementation group: 'org.bytedeco', name: 'openblas', version: '0.3.13-1.5.7', classifier: "linux-x86_64"

    implementation "org.nd4j:nd4j-native:1.0.0-M2.1"

    implementation "org.nd4j:nd4j-native:1.0.0-M2.1:linux-x86_64"

    implementation 'org.bytedeco:javacpp:1.5.7'

    implementation platform('com.fasterxml.jackson:jackson-bom:2.18.3')

    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    implementation 'com.fasterxml.jackson.core:jackson-core'

//    implementation 'org.languagetool:language-sk:6.5'
    implementation 'org.languagetool:language-sk:6.6.12-3'
    implementation 'com.ibm.icu:icu4j:76.1'
}
