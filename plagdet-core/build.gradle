plugins {
//  id 'application'
  id 'java-library'
  id 'com.github.johnrengelman.shadow' version '8.1.1'
}

shadowJar {
  archiveBaseName.set('plagdet-core-fat')
  archiveClassifier.set('')
  archiveVersion.set('2.0')
  zip64 true
  minimize()
  exclude('org/bytedeco/**/windows-x86_64/**')
  exclude('org/bytedeco/**/macosx-x86_64/**')
  exclude('org/bytedeco/**/android-arm/**')
  exclude('org/bytedeco/**/android-arm64/**')
  exclude('org/bytedeco/**/linux-arm/**')
  exclude('org/bytedeco/**/linux-arm64/**')
}


repositories {
  mavenCentral()

  flatDir {
    dirs '../libs'
  }

}

ext {
  javacppPlatform = 'linux-x86_64'
}


//
//application {
