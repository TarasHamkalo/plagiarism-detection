plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}


repositories {
    mavenCentral()
    flatDir {
        dirs '../libs'
    }

}

ext {
    javacppPlatform = 'linux-x86_64'
}

dependencies {
    implementation "org.apache.lucene:lucene-core:$luceneVersion"
    implementation "org.apache.lucene:lucene-queryparser:$luceneVersion"
    implementation "org.apache.lucene:lucene-analyzers-common:$luceneVersion"
    implementation "org.apache.lucene:lucene-backward-codecs:$luceneVersion"
    implementation "org.apache.lucene:lucene-codecs:$luceneVersion"

    implementation "org.apache.poi:poi-ooxml:$poiVersion"
    implementation "org.apache.poi:poi-scratchpad:$poiVersion"

    implementation "org.apache.commons:commons-compress:$commonsCompressVersion"

    implementation "com.itextpdf:itext7-core:$itextCoreVersion"

    implementation "org.apache.commons:commons-text:$commonsTextVersion"

    implementation "io.github.jbellis:jvector:$jvectorVersion"

    implementation ':morphodita:'

    implementation("edu.stanford.nlp:stanford-corenlp:$stanfordCoreNlpVersion") {
        exclude group: 'com.apple', module: 'AppleJavaExtensions'
        exclude group: 'jakarta.servlet', module: 'jakarta.servlet-api'
        exclude group: 'org.ejml', module: 'jakarta.json'
        exclude group: 'org.ejml', module: 'ejml-simple'
        exclude group: 'org.glassfish', module: 'jakarta.json'
    }

    implementation("org.deeplearning4j:deeplearning4j-nlp:$deeplearning4jVersion") {
        exclude group: 'org.bytedeco', module: 'openblas'
        exclude group: 'org.bytedeco', module: 'opencv'
        exclude group: 'org.bytedeco', module: 'hdf5'
        exclude group: 'org.bytedeco', module: 'leptonica'
        exclude group: 'org.bytedeco', module: 'ffmpeg'
//            exclude group: 'org.deeplearning4j', module: 'deeplearning4j-datasets'
        exclude group: 'org.datavec', module: 'datavec-data-image'
    }

    implementation group: 'org.bytedeco', name: 'openblas', version: bytedecoOpenblasVersion, classifier: "linux-x86_64"

    implementation "org.nd4j:nd4j-native:$nd4jVersion"
    implementation "org.nd4j:nd4j-native:$nd4jVersion:linux-x86_64"

    implementation "org.bytedeco:javacpp:$javacppVersion"

    implementation platform("com.fasterxml.jackson:jackson-bom:$jacksonBomVersion")
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-core'

    // TODO: update langtool
    implementation 'org.languagetool:language-sk:6.5'

    implementation "com.ibm.icu:icu4j:$icu4jVersion"
}
