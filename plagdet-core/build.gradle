plugins {
//  id 'application'
  id 'java-library'
}

repositories {
  mavenCentral()

  flatDir {
    dirs '../libs'
  }
}
//
//application {
//  mainClass = 'dev.taras.hamkalo.plagdet.Main'
//}
//

tasks.withType(JavaExec).configureEach {
  systemProperty 'java.library.path', '../libs'
}

dependencies {

  implementation 'org.apache.lucene:lucene-core:8.10.1'

  implementation 'org.apache.lucene:lucene-queryparser:8.10.1'

  implementation 'org.apache.lucene:lucene-analyzers-common:8.10.1'

  implementation 'org.apache.poi:poi-ooxml:5.4.0'

  implementation 'org.apache.poi:poi:5.4.0'

  implementation 'org.apache.poi:poi-scratchpad:5.4.0'

  implementation 'org.apache.commons:commons-lang3:3.16.0'

  implementation 'commons-io:commons-io:2.17.0'

  implementation 'org.apache.commons:commons-compress:1.27.1'

  implementation ':morphodita:'

  implementation 'edu.stanford.nlp:stanford-corenlp:4.5.7'
//  api 'edu.stanford.nlp:stanford-corenlp:4.5.7'

  implementation 'org.deeplearning4j:deeplearning4j-nlp:1.0.0-M2.1'

  implementation 'org.nd4j:nd4j-native-platform:1.0.0-M2.1'

  implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

  implementation 'commons-cli:commons-cli:1.9.0'
}
