plugins {
  id 'application'
}

dependencies {
//    implementation 'org.apache.commons:commons-text'

  implementation 'commons-io:commons-io:2.17.0'

  implementation 'edu.stanford.nlp:stanford-corenlp:4.5.7'

  implementation 'org.apache.commons:commons-lang3:3.16.0'

  implementation 'org.docx4j:docx4j:6.1.2'

  implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.1'

  implementation 'org.apache.poi:poi-ooxml:4.1.2'

  // https://mvnrepository.com/artifact/org.apache.lucene/lucene-core
  implementation 'org.apache.lucene:lucene-core:8.10.1'

  // https://mvnrepository.com/artifact/org.apache.lucene/lucene-queryparser
  implementation 'org.apache.lucene:lucene-queryparser:8.10.1'

  // https://mvnrepository.com/artifact/org.apache.lucene/lucene-analyzers-common
  implementation 'org.apache.lucene:lucene-analyzers-common:8.10.1'
//
//// https://mvnrepository.com/artifact/org.apache.lucene/lucene-analyzers
//
//  implementation 'org.apache.lucene:lucene-analyzers:3.6.2'
//
//// https://mvnrepository.com/artifact/org.apache.lucene/lucene-misc
//  implementation 'org.apache.lucene:lucene-misc:10.0.0'
  runtimeOnly "org.postgresql:postgresql:$postgresqlVersion"

  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

// https://mvnrepository.com/artifact/com.h2database/h2
  implementation 'com.h2database:h2:2.3.232'

  implementation 'de.jplag:jplag:5.1.0'

  implementation 'de.jplag:text:5.1.0'
}

application {
  // Define the main class for the application.
  mainClass = 'dev.taras.hamkalo.plagdet.App'
}
