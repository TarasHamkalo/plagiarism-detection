plugins {
  id 'application'

  id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
  mavenCentral()

  flatDir {
    dirs '../libs'
  }
}

shadowJar {
  archiveBaseName.set('plagdet-cli')
  archiveClassifier.set('')
  archiveVersion.set('2.1')
  zip64 true
//  minimize()
  mergeServiceFiles()
}

application {
  mainClass = 'dev.taras.hamkalo.plagdet.Main'
}

tasks.withType(JavaExec).configureEach {
  systemProperty 'java.library.path', '../libs'
}

dependencies {

  implementation 'commons-cli:commons-cli:1.9.0'

  implementation project(':plagdet-core')

}
