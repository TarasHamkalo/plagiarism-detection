plugins {
    id 'application'

    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

repositories {
    mavenCentral()

    flatDir {
        dirs '../libs'
    }

    maven {
        url "https://repo.languagetool.org/artifactory/languagetool-os-release/"
    }
}

shadowJar {
    archiveBaseName.set('plagdet-cli')
    archiveClassifier.set('')
    archiveVersion.set('2.2')
    zip64 true
    mergeServiceFiles()
    exclude('**/windows-x86/**')
    exclude('org/bytedeco/**/windows-x86_64/**')
    exclude('org/bytedeco/**/macosx-x86_64/**')
    exclude('org/bytedeco/**/android-arm/**')
    exclude('org/bytedeco/**/android-arm64/**')
    exclude('org/bytedeco/**/linux-arm/**')
    exclude('org/bytedeco/**/linux-arm64/**')
}


application {
    mainClass = 'dev.taras.hamkalo.plagdet.Main'
}

tasks.withType(JavaExec).configureEach {
    systemProperty 'java.library.path', '../libs'
    // heap -- min 512M
    // metaspace -- min 64M
    jvmArgs '-Xmx512M', '-Xmx1024M', '-XX:MaxMetaspaceSize=124M'
}

dependencies {

    implementation 'commons-cli:commons-cli:1.9.0'

    implementation project(':plagdet-core')

}
